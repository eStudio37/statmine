name: Bug report
description: Something in statmine doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: statmine
    attributes:
      label: statmine version
      description: Shown after the label in the full view's header, or by `claude plugin list`.
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and terminal
      placeholder: Ubuntu 24.04 on WSL2, Windows Terminal
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: View
      description: Set with `/statmine:mode`.
      options:
        - full
        - compact
        - not sure
  - type: textarea
    id: output
    attributes:
      label: Statusline output
      description: >-
        The statusline as it appeared, copied from the screen. Replace the text
        of your request rows first: they hold your own prompts. If it showed
        nothing or an error, paste what the by-hand run under "Something else"
        in the user guide's troubleshooting prints. Folder and branch names
        show too; change them if they are private.
      render: text
