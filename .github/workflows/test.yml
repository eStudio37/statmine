name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Syntax-check the shell scripts
        run: bash -n scripts/statusline.sh && bash -n hooks/sync.sh
      - name: Run tests
        run: bun test tests
